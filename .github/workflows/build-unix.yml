name: Build Linux and macOS and Windows

on:
  push:
    branches: [ main ]
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install GTK3
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev

      - name: Compile and Package Linux Installer
        run: |
          mkdir -p linux-pkg
          gcc launcher_linux.c modrinth.c -o linux-pkg/PortableMC-GUI `pkg-config --cflags --libs gtk+-3.0` -lm -Os -s
          chmod +x linux-pkg/PortableMC-GUI
          cp icon.png linux-pkg/icon.png || true

          cat << 'EOF' > linux-pkg/install.sh
          #!/usr/bin/env bash
          set -e
          DIR="$(cd "$(dirname "${BASH_SOURCE}")" && pwd)"
          mkdir -p "$HOME/.local/bin" "$HOME/.local/share/icons/hicolor/256x256/apps" "$HOME/.local/share/applications"

          cp "$DIR/PortableMC-GUI" "$HOME/.local/bin/PortableMC-GUI"
          chmod +x "$HOME/.local/bin/PortableMC-GUI"

          if [ -f "$DIR/icon.png" ]; then
            cp "$DIR/icon.png" "$HOME/.local/share/icons/hicolor/256x256/apps/portablemc-gui.png"
          fi

          cat << 'DESKTOP' > "$HOME/.local/share/applications/portablemc-gui.desktop"
          [Desktop Entry]
          Name=PortableMC
          Comment=Lightweight Native Minecraft Launcher
          Exec=%h/.local/bin/PortableMC-GUI
          Icon=portablemc-gui
          Terminal=false
          Type=Application
          Categories=Game;
          DESKTOP

          chmod +x "$HOME/.local/share/applications/portablemc-gui.desktop"
          update-desktop-database "$HOME/.local/share/applications" 2>/dev/null || true

          if ! command -v portablemc >/dev/null 2>&1; then
            echo "Installing portablemc CLI backend..."
            pip3 install --user portablemc 2>/dev/null || pip install --user portablemc 2>/dev/null || echo "Note: Install 'portablemc' via pip if needed."
          fi

          echo "PortableMC installed! You can now launch it from your Applications menu or run 'PortableMC-GUI'."
          EOF
          chmod +x linux-pkg/install.sh

          cat << 'EOF' > linux-pkg/uninstall.sh
          #!/usr/bin/env bash
          set -e
          rm -f "$HOME/.local/bin/PortableMC-GUI"
          rm -f "$HOME/.local/share/icons/hicolor/256x256/apps/portablemc-gui.png"
          rm -f "$HOME/.local/share/applications/portablemc-gui.desktop"
          update-desktop-database "$HOME/.local/share/applications" 2>/dev/null || true
          echo "PortableMC has been completely uninstalled."
          EOF
          chmod +x linux-pkg/uninstall.sh

          tar -czvf PortableMC-GUI-Linux.tar.gz -C linux-pkg .
          sha256sum PortableMC-GUI-Linux.tar.gz > PortableMC-GUI-Linux.tar.gz.sha256

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PortableMC-GUI-Linux
          path: PortableMC-GUI-Linux.tar.gz

      - name: Attach to Release (if tag)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            PortableMC-GUI-Linux.tar.gz
            PortableMC-GUI-Linux.tar.gz.sha256

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compile macOS App Bundle (macOS 11+ Universal)
        run: |
          mkdir -p PortableMC-GUI.app/Contents/MacOS
          mkdir -p PortableMC-GUI.app/Contents/Resources
          cp icon.png PortableMC-GUI.app/Contents/Resources/icon.png || true
          clang -fobjc-arc -arch arm64 -arch x86_64 -mmacosx-version-min=11.0 launcher_mac.m modrinth.c -framework Cocoa -o PortableMC-GUI.app/Contents/MacOS/PortableMC-GUI -Os
          cat << 'EOF' > PortableMC-GUI.app/Contents/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>PortableMC-GUI</string>
            <key>CFBundleIdentifier</key>
            <string>com.claimy17.portablemc-gui</string>
            <key>CFBundleName</key>
            <string>PortableMC-GUI</string>
            <key>CFBundleIconFile</key>
            <string>icon.png</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>LSMinimumSystemVersion</key>
            <string>11.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          EOF
          codesign --force --deep --sign - PortableMC-GUI.app
          zip -r PortableMC-GUI-macOS.zip PortableMC-GUI.app
          shasum -a 256 PortableMC-GUI-macOS.zip > PortableMC-GUI-macOS.zip.sha256

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PortableMC-GUI-macOS
          path: PortableMC-GUI-macOS.zip

      - name: Attach to Release (if tag)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            PortableMC-GUI-macOS.zip
            PortableMC-GUI-macOS.zip.sha256

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate Resources and Compile Windows EXE
        shell: cmd
        run: |
          (
          echo 1 ICON "icon.ico"
          echo 1 VERSIONINFO
          echo FILEVERSION 1,0,0,0
          echo PRODUCTVERSION 1,0,0,0
          echo BEGIN
          echo   BLOCK "StringFileInfo"
          echo   BEGIN
          echo     BLOCK "040904b0"
          echo     BEGIN
          echo       VALUE "CompanyName", "Seby17S"
          echo       VALUE "FileDescription", "PortableMC Lightweight GUI"
          echo       VALUE "FileVersion", "1.0.0.0"
          echo       VALUE "OriginalFilename", "PortableMC-GUI.exe"
          echo       VALUE "ProductName", "PortableMC GUI"
          echo     END
          echo   END
          echo   BLOCK "VarFileInfo"
          echo   BEGIN
          echo     VALUE "Translation", 0x409, 1200
          echo   END
          echo END
          ) > app.rc
          windres app.rc -O coff -o app.res
          gcc launcher.c modrinth.c app.res -o PortableMC-GUI.exe -mwindows -lcomctl32 -lshell32 -lgdi32 -lmsimg32 -ldwmapi -luxtheme -lole32 -lwininet -Os -s
          certutil -hashfile PortableMC-GUI.exe SHA256 > PortableMC-GUI.exe.sha256

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PortableMC-GUI-Windows
          path: PortableMC-GUI.exe

      - name: Attach to Release (if tag)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            PortableMC-GUI.exe
            PortableMC-GUI.exe.sha256
