name: Build macOS App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile Universal macOS Binary (Intel + Apple Silicon)
        run: |
          mkdir -p "PortableMC-GUI.app/Contents/MacOS"
          mkdir -p "PortableMC-GUI.app/Contents/Resources"
          clang -framework Cocoa -fobjc-arc -arch x86_64 -arch arm64 -O2 launcher_mac.m -o "PortableMC-GUI.app/Contents/MacOS/PortableMC-GUI"

      - name: Generate App Icon (.icns) from icon.png
        run: |
          if [ -f "icon.png" ]; then
            mkdir -p AppIcon.iconset
            sips -z 16 16     icon.png --out AppIcon.iconset/icon_16x16.png
            sips -z 32 32     icon.png --out AppIcon.iconset/icon_16x16@2x.png
            sips -z 32 32     icon.png --out AppIcon.iconset/icon_32x32.png
            sips -z 64 64     icon.png --out AppIcon.iconset/icon_32x32@2x.png
            sips -z 128 128   icon.png --out AppIcon.iconset/icon_128x128.png
            sips -z 256 256   icon.png --out AppIcon.iconset/icon_128x128@2x.png
            sips -z 256 256   icon.png --out AppIcon.iconset/icon_256x256.png
            sips -z 512 512   icon.png --out AppIcon.iconset/icon_256x256@2x.png
            sips -z 512 512   icon.png --out AppIcon.iconset/icon_512x512.png
            sips -z 1024 1024 icon.png --out AppIcon.iconset/icon_512x512@2x.png
            iconutil -c icns AppIcon.iconset -o "PortableMC-GUI.app/Contents/Resources/AppIcon.icns"
            rm -rf AppIcon.iconset
          fi

      - name: Create Info.plist and Ad-Hoc Sign
        run: |
          cat > "PortableMC-GUI.app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>PortableMC-GUI</string>
            <key>CFBundleIdentifier</key>
            <string>com.claimy17.portablemc-gui</string>
            <key>CFBundleName</key>
            <string>PortableMC</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.2.1</string>
            <key>CFBundleIconFile</key>
            <string>AppIcon</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          EOF
          codesign --force --deep --sign - "PortableMC-GUI.app"
          zip -r PortableMC-GUI-macOS-Universal.zip "PortableMC-GUI.app"
          shasum -a 256 PortableMC-GUI-macOS-Universal.zip > SHA256SUMS-macOS.txt

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PortableMC-GUI-macOS-Universal
          path: |
            PortableMC-GUI-macOS-Universal.zip
            SHA256SUMS-macOS.txt
