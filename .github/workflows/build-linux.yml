name: Build Linux Binaries

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install GTK3 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgtk-3-dev

      - name: Compile PortableMC-GUI for Linux
        run: |
          gcc launcher_linux.c -o PortableMC-GUI-Linux $(pkg-config --cflags --libs gtk+-3.0)
          chmod +x PortableMC-GUI-Linux

      - name: Package with Icon and Installer
        run: |
          mkdir -p pkg
          cp PortableMC-GUI-Linux pkg/
          cp icon.png pkg/ 2>/dev/null || true
          cp install_linux.sh pkg/ 2>/dev/null || true
          tar -czf PortableMC-GUI-Linux-x86_64.tar.gz -C pkg .
          sha256sum PortableMC-GUI-Linux-x86_64.tar.gz > SHA256SUMS.txt

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PortableMC-GUI-Linux-x86_64
          path: |
            PortableMC-GUI-Linux-x86_64.tar.gz
            SHA256SUMS.txt
